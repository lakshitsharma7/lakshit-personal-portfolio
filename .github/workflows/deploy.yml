name: Build and Verify Portfolio

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

      - name: Verify Resume PDF Exists in Build
        run: |
          test -f dist/Lakshit_Sharma_Resume.pdf || { echo "Resume PDF missing in dist!"; exit 1; }
          echo "Production build and resume assets verified successfully."
